[project]
name = "sls-spending-import"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pynab",
    "pyparsing>=3.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "boto3>=1.35",
    "botocore>=1.35",
]

[tool.uv.sources]
pynab = { url = "https://github.com/idwagner/pynab/archive/0.1.3.tar.gz" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
